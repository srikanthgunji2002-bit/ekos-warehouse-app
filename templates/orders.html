{% extends "base.html" %}
{% block content %}
<div class="space-y-6">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <h1 class="text-xl md:text-2xl font-bold text-slate-800">Orders Management</h1>
        <button id="addOrderBtn" onclick="openModal('addOrderModal')" class="w-full md:w-auto bg-indigo-600 text-white px-4 py-2 rounded text-xs md:text-sm font-medium hover:bg-indigo-700">+ Create Upcoming Order</button>
    </div>

    <!-- Tabs -->
    <div class="flex space-x-4 border-b text-xs md:text-sm">
        <button id="tabUpcoming" onclick="switchTab('upcoming')" class="pb-2 font-bold border-b-2 border-indigo-600 text-indigo-600">Upcoming Orders (<span id="countUpcoming">0</span>)</button>
        <button id="tabCompleted" onclick="switchTab('completed')" class="pb-2 font-bold text-slate-400 border-b-2 border-transparent">Completed Orders (<span id="countCompleted">0</span>)</button>
    </div>

    <!-- Orders Table (Mobile Overflow Scroll) -->
    <div class="bg-white p-4 md:p-6 rounded-lg shadow overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
            <thead>
                <tr class="border-b bg-slate-100 text-slate-700">
                    <th class="p-2.5">Order No</th>
                    <th class="p-2.5">Customer Details</th>
                    <th class="p-2.5">Product Details</th>
                    <th class="p-2.5">Qty</th>
                    <th class="p-2.5">Order Date</th>
                    <th class="p-2.5">Expected Delivery</th>
                    <th class="p-2.5">Status</th>
                    <th class="p-2.5 text-right">Admin Actions</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
        </table>
    </div>
</div>

<!-- Modal: Add New Upcoming Order -->
<div id="addOrderModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-white p-6 rounded-lg shadow-xl max-w-md w-full space-y-3 max-h-[90vh] overflow-y-auto">
        <h3 class="text-lg font-bold text-slate-800">Create Upcoming Order</h3>
        <form id="addOrderForm" class="space-y-3">
            <input type="text" id="ordNo" placeholder="Order No (e.g. ORD-1001)" class="w-full border p-2 text-xs rounded" required />
            <input type="text" id="ordCust" placeholder="Customer Name" class="w-full border p-2 text-xs rounded" required />
            <input type="tel" id="ordPhone" placeholder="Customer Phone Number" class="w-full border p-2 text-xs rounded" required />
            <input type="text" id="ordProd" placeholder="Product Details / Name" class="w-full border p-2 text-xs rounded" required />
            <input type="number" id="ordQty" placeholder="Quantity NOS" class="w-full border p-2 text-xs rounded" required />
            <div>
                <label class="block text-[10px] text-slate-500 mb-1">Order Date</label>
                <input type="date" id="ordDate" class="w-full border p-2 text-xs rounded" required />
            </div>
            <div>
                <label class="block text-[10px] text-slate-500 mb-1">Expected Delivery Date</label>
                <input type="date" id="ordDelDate" class="w-full border p-2 text-xs rounded" required />
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button type="button" onclick="closeModal('addOrderModal')" class="px-4 py-2 text-xs border rounded">Cancel</button>
                <button type="submit" class="px-4 py-2 text-xs bg-indigo-600 text-white rounded font-bold">Save Upcoming Order</button>
            </div>
        </form>
    </div>
</div>

<script>
    let ordersList = [];
    let currentTab = 'upcoming';

    async function loadOrders() {
        const res = await fetch('/api/orders');
        ordersList = await res.json();
        
        const role = localStorage.getItem('ekos_role') || 'employee';
        if (role !== 'admin') {
            document.getElementById('addOrderBtn').style.display = 'none';
        }

        renderOrdersTable();
    }

    function switchTab(tab) {
        currentTab = tab;
        if (tab === 'upcoming') {
            document.getElementById('tabUpcoming').className = "pb-2 font-bold border-b-2 border-indigo-600 text-indigo-600";
            document.getElementById('tabCompleted').className = "pb-2 font-bold text-slate-400 border-b-2 border-transparent";
        } else {
            document.getElementById('tabCompleted').className = "pb-2 font-bold border-b-2 border-indigo-600 text-indigo-600";
            document.getElementById('tabUpcoming').className = "pb-2 font-bold text-slate-400 border-b-2 border-transparent";
        }
        renderOrdersTable();
    }

    function renderOrdersTable() {
        const role = localStorage.getItem('ekos_role') || 'employee';
        const upcoming = ordersList.filter(o => o.status === 'upcoming');
        const completed = ordersList.filter(o => o.status === 'completed');

        document.getElementById('countUpcoming').innerText = upcoming.length;
        document.getElementById('countCompleted').innerText = completed.length;

        const displayList = currentTab === 'upcoming' ? upcoming : completed;

        document.getElementById('ordersTableBody').innerHTML = displayList.length === 0 ? 
            `<tr><td colspan="8" class="p-4 text-center text-slate-400">No ${currentTab} orders recorded.</td></tr>` :
            displayList.map(o => `
                <tr class="border-b hover:bg-slate-50">
                    <td class="p-2.5 font-bold font-mono text-slate-800">${o.order_number}</td>
                    <td class="p-2.5 font-medium">${o.customer_name}<br/><span class="text-[10px] text-slate-500">📞 ${o.customer_phone || 'N/A'}</span></td>
                    <td class="p-2.5">${o.product_details}</td>
                    <td class="p-2.5 font-bold">${o.quantity} NOS</td>
                    <td class="p-2.5 text-slate-500">${o.order_date}</td>
                    <td class="p-2.5 text-slate-500">${o.expected_delivery_date}</td>
                    <td class="p-2.5"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${o.status === 'completed' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${o.status.toUpperCase()}</span></td>
                    <td class="p-2.5 text-right space-x-1 whitespace-nowrap">
                        ${role === 'admin' ? `
                            ${o.status === 'upcoming' ? `<button onclick="markStatus(${o.id}, 'completed')" class="px-2 py-1 bg-emerald-100 text-emerald-800 rounded font-bold hover:bg-emerald-200">✓ Complete</button>` : `<button onclick="markStatus(${o.id}, 'upcoming')" class="px-2 py-1 bg-amber-100 text-amber-800 rounded font-bold hover:bg-amber-200">↺ Reopen</button>`}
                            <button onclick="deleteOrder(${o.id})" class="px-2 py-1 bg-red-100 text-red-700 rounded font-bold hover:bg-red-200">Delete</button>
                        ` : '<span class="text-slate-400">Read Only</span>'}
                    </td>
                </tr>
            `).join('');
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    document.getElementById('addOrderForm').onsubmit = async (e) => {
        e.preventDefault();
        await fetch('/api/orders', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                order_number: document.getElementById('ordNo').value,
                customer_name: document.getElementById('ordCust').value,
                customer_phone: document.getElementById('ordPhone').value,
                product_details: document.getElementById('ordProd').value,
                quantity: parseInt(document.getElementById('ordQty').value),
                order_date: document.getElementById('ordDate').value,
                expected_delivery_date: document.getElementById('ordDelDate').value,
                status: 'upcoming'
            })
        });
        closeModal('addOrderModal');
        e.target.reset();
        loadOrders();
    };

    async function markStatus(id, newStatus) {
        await fetch(`/api/orders/${id}/status`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ status: newStatus })
        });
        loadOrders();
    }

    async function deleteOrder(id) {
        if (confirm("Delete this order record?")) {
            await fetch(`/api/orders/${id}`, { method: 'DELETE' });
            loadOrders();
        }
    }

    loadOrders();
</script>
{% endblock %}
