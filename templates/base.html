<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport Tag Enforces Native Mobile Screen Scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EKOS - ERP System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col">
    
    <!-- Top Bar Header -->
    <header class="bg-white border-b shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- Hamburger Button (3-lines) -->
                <button onclick="toggleSidebar()" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-700 font-bold text-2xl focus:outline-none">
                    ☰
                </button>
                
                <div class="flex items-center space-x-2">
                    <img src="/static/logo.png" alt="EKOS Logo" class="h-8 md:h-9 w-auto" onerror="this.style.display='none'" />
                    <span class="text-lg md:text-xl font-bold text-slate-800 tracking-wide">EKOS ERP</span>
                </div>
            </div>

            <div class="flex items-center space-x-2 md:space-x-4">
                <span id="userInfo" class="bg-slate-100 text-slate-700 px-2 py-1 rounded text-[11px] md:text-xs font-mono border"></span>
                <button onclick="logout()" class="text-xs text-red-600 font-semibold hover:underline">Logout</button>
            </div>
        </div>
    </header>

    <!-- Mobile Drawer Overlay Backdrop -->
    <div id="sidebarBackdrop" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-slate-900/60 z-40 backdrop-blur-xs"></div>

    <!-- Mobile Left Sidebar Drawer Navigation -->
    <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 max-w-[80vw] bg-slate-900 text-white z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl flex flex-col">
        <div class="p-5 border-b border-slate-800 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="/static/logo.png" alt="Logo" class="h-7 w-auto" onerror="this.style.display='none'" />
                <span class="font-bold text-base text-white">EKOS Navigation</span>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-xl p-1">✕</button>
        </div>

        <nav class="flex-grow py-4 space-y-1.5 px-3 text-sm font-medium overflow-y-auto">
            <a href="/" id="navDash" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                <span class="text-lg">📊</span><span>Dashboard</span>
            </a>
            <a href="/inventory" id="navInv" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                <span class="text-lg">📦</span><span>Stock Directory</span>
            </a>
            <a href="/orders" id="navOrders" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                <span class="text-lg">🚚</span><span>Orders (Upcoming & Done)</span>
            </a>
            <a href="/sales" id="navSales" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                <span class="text-lg">👥</span><span>Customers & Sales</span>
            </a>
            <a href="/invoices" id="navInvoices" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                <span class="text-lg">📄</span><span>Invoices & Billing</span>
            </a>
            <a href="/settings" id="navSettings" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-amber-400 hover:bg-slate-800 hover:text-amber-300 transition border-t border-slate-800 mt-4">
                <span class="text-lg">⚙️</span><span>Settings & Controls</span>
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
            EKOS Sustainable Packaging
        </div>
    </aside>

    <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 py-6 flex-grow">
        {% block content %}{% endblock %}
    </main>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        }

        function checkAuth() {
            const role = localStorage.getItem('ekos_role');
            const user = localStorage.getItem('ekos_user');

            if (!role || !user) {
                window.location.href = '/login';
                return;
            }

            document.getElementById('userInfo').innerText = `${user} (${role.toUpperCase()})`;

            // Employee Restrictions
            if (role === 'employee') {
                if (document.getElementById('navSales')) document.getElementById('navSales').style.display = 'none';
                if (document.getElementById('navInvoices')) document.getElementById('navInvoices').style.display = 'none';
                if (document.getElementById('navSettings')) document.getElementById('navSettings').style.display = 'none';

                if (window.location.pathname === '/sales' || window.location.pathname === '/invoices' || window.location.pathname === '/settings') {
                    window.location.href = '/inventory';
                }
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }

        checkAuth();
    </script>
</body>
</html>
